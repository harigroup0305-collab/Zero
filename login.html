<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1118"><title>Masuk / Daftar | ZERO</title><link rel="stylesheet" href="zero-app.css"><link rel="stylesheet" href="auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="auth.js" defer></script></head><body><main class="auth-page"><section class="auth-card"><a class="auth-brand" href="index.html">ZERO<span>.</span></a><h1 style="font-size:2rem;margin-top:26px">Selamat datang.</h1><p class="auth-sub">Masuk ke ruang trading dan investasi personal Anda.</p><div class="auth-tabs"><button id="loginTab" type="button" aria-pressed="true">Masuk</button><button id="signupTab" type="button" aria-pressed="false">Buat akun</button></div><section id="loginPanel"><form id="loginForm" class="auth-fields"><div><label for="loginEmail">Email</label><input id="loginEmail" name="email" type="email" autocomplete="email" required placeholder="nama@email.com"></div><div><label for="loginPassword">Kata sandi</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="Masukkan kata sandi"></div><button type="submit">Masuk ke ZERO</button></form></section><section id="signupPanel" hidden><form id="signupForm" class="auth-fields"><div><label for="signupEmail">Email</label><input id="signupEmail" name="email" type="email" autocomplete="email" required placeholder="nama@email.com"></div><div><label for="signupPassword">Kata sandi (minimal 8 karakter)</label><input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Buat kata sandi"></div><div><label for="confirmPassword">Ulangi kata sandi</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulangi kata sandi"></div><button type="submit">Daftar akun</button></form></section><p id="authStatus" class="auth-status" role="status" aria-live="polite"></p><a class="auth-back" href="index.html">← Kembali ke beranda</a></section></main></body></html>
